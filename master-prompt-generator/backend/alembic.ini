# Alembic owns the schema outside local development.
#
#   alembic upgrade head      apply everything outstanding
#   alembic revision --autogenerate -m "add x"   draft a new revision
#   alembic current           what this database is at
#
# The URL is not set here on purpose: it comes from DATABASE_URL via
# alembic/env.py, so migrations always target the same database the app does
# and a credential never lands in a committed file.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
