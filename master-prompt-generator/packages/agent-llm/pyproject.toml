[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-llm"
version = "0.1.0"
description = "One model, called safely: retries, cost accounting, JSON recovery and SSRF-safe outbound requests."
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.55",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.25"]

[tool.setuptools.packages.find]
include = ["agent_llm*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
