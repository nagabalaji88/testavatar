name: master-prompt-generator

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-local}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-mpg}:${POSTGRES_PASSWORD:-mpg}@postgres:5432/${POSTGRES_DB:-mpg}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  QDRANT_URL: http://qdrant:6333
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:-please-change-this-secret}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  TOGETHER_API_KEY: ${TOGETHER_API_KEY:-}
  # Open-source stack. Point MODEL_CONFIG_PATH at models.local.json (see the
  # `local` profile) to run entirely on open-weight models with no API keys.
  MODEL_CONFIG_PATH: ${MODEL_CONFIG_PATH:-/srv/config/models.json}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
  ANALYZER_MODEL_ID: ${ANALYZER_MODEL_ID:-openai-gpt4o}
  JUDGE_MODEL_ID: ${JUDGE_MODEL_ID:-anthropic-claude-sonnet}
  CONSENSUS_MODEL_ID: ${CONSENSUS_MODEL_ID:-anthropic-claude-sonnet}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
  EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
  GENERATION_TIMEOUT_SECONDS: ${GENERATION_TIMEOUT_SECONDS:-180}
  JUDGE_TIMEOUT_SECONDS: ${JUDGE_TIMEOUT_SECONDS:-120}
  MAX_PARALLEL_GENERATIONS: ${MAX_PARALLEL_GENERATIONS:-8}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  OTEL_ENABLED: ${OTEL_ENABLED:-false}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mpg}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mpg}
      POSTGRES_DB: ${POSTGRES_DB:-mpg}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mpg} -d ${POSTGRES_DB:-mpg}']
      interval: 10s
      timeout: 5s
      retries: 6

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis-data:/data
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 4s
      retries: 6

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - '${QDRANT_PORT:-6333}:6333'

  # --- Open-source inference (profile: local) -----------------------------
  # Serves open-weight models from your own hardware. No API key, no per-token
  # cost. Started only with `--profile local`, because the images and model
  # weights are several GB and are pure waste for an API-key deployment.
  ollama:
    image: ollama/ollama:0.5.4
    profiles: ['local']
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      # Serialised by default: three 7B models answering at once will thrash a
      # machine without a GPU. Raise it if you have the VRAM.
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-1}
      OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-3}
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - '${OLLAMA_PORT:-11434}:11434'
    healthcheck:
      test: ['CMD-SHELL', 'ollama list >/dev/null 2>&1 || exit 1']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # One-shot: pulls the weights the local registry references, then exits.
  ollama-pull:
    image: ollama/ollama:0.5.4
    profiles: ['local']
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        set -e
        for model in ${OLLAMA_MODELS:-qwen2.5:7b-instruct llama3.1:8b-instruct-q4_K_M mistral:7b-instruct nomic-embed-text}; do
          echo "pulling $$model"
          ollama pull "$$model"
        done
        echo "all models ready"
    restart: 'no'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment: *backend-env
    volumes:
      # Providers are configured declaratively; mounting the file lets operators
      # add models without rebuilding the image.
      - ./backend/config:/srv/config
    ports:
      - '${BACKEND_PORT:-8000}:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      - celery
      - -A
      - app.workers.celery_app.celery_app
      - worker
      - --loglevel=info
      - --concurrency=${CELERY_CONCURRENCY:-4}
      - --without-gossip
      - --without-mingle
    environment: *backend-env
    volumes:
      - ./backend/config:/srv/config
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD-SHELL', 'celery -A app.workers.celery_app.celery_app inspect ping -d celery@$$HOSTNAME']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-8080}:80'
    depends_on:
      backend:
        condition: service_started

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  ollama-models:
